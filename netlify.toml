[build]
  publish = "."

[[redirects]]
  from = "/destinations"
  to = "/destinations/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain"

# The shared monetization scripts carry the affiliate marker, so a stale copy in a
# returning visitor's cache means unattributed clicks. These are two small files —
# revalidate every load (304s are cheap) rather than serving them for 4 hours.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
